[project]
name = "lab-brain"
version = "0.0.1"
description = "Laboratory Innovation Brain — executable epistemic architecture (spec: SAI 3.3)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "SpadesZ", email = "rickiekuo1203@gmail.com" }]

dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
lab-brain = "lab_brain.interfaces.cli:main"

# The product research vertical a deployment runs is chosen BY NAME (`lab-brain research run
# --domain ...`). Naming the factory here, rather than importing a pack from the CLI, keeps §24.2's
# rule that orchestration never imports a DomainPack: this table is the one place a pack is named.
[project.entry-points."lab_brain.domain_verticals"]
silicon_photonics = "lab_brain.domains.silicon_photonics.product:product_vertical"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_brain"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# The outcome report is always written, so `check_requirement_coverage.py` can never be
# satisfied by a stale file left over from an earlier, more permissive run.
addopts = "-ra --strict-markers --strict-config --requirement-outcomes=var/requirement_outcomes.json"
markers = [
    # Requirement / Test traceability (SAI 3.3 §26). Every test that discharges a
    # normative requirement MUST carry both markers so T-SPEC-001 can verify the
    # matrix against real code rather than against prose.
    "requirement(id): Requirement ID this test discharges, e.g. ART-001",
    "spec_test(id): Test ID from the §26 traceability matrix, e.g. T-ART-001",
    # Environment gates (AGT-007: CI must pass without Postgres/licenses/network).
    "postgres: requires a live PostgreSQL instance",
    "lumerical: requires a real Lumerical license seat",
    "network: requires outbound network access",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "TID"]
ignore = [
    "N818",  # exception names: spec contract names are kept verbatim
    # The spec is written in Traditional Chinese and uses fullwidth punctuation. Parsing it
    # requires those exact codepoints, and docstrings quote its section headings verbatim,
    # so "ambiguous unicode" is the intended content rather than a typo.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# `tests` is an importable package here (tests/conftest_fixtures.py is shared), so it must sort
# as first-party rather than alongside third-party dependencies.
known-first-party = ["lab_brain", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# §24.2 dependency rule is enforced by T-EXT-001; this is a fast local guard.
"lab_brain.domains.silicon_photonics".msg = "core/cognition MUST NOT import a DomainPack directly (§24.2)"

[tool.ruff.lint.per-file-ignores]
# Tests import DomainPacks on purpose -- that is what T-DOM-SP-001, T-DOM-SP-002 and T-EXT-001
# exercise. The ban is on the SHIPPED package reaching into a domain (§24.2's forbidden
# `core -> domains.silicon_photonics` edge), and `tests/unit/test_extension_boundary.py` checks
# that direction by parsing the import graph -- where it can tell a consumer from a test.
"tests/**" = ["E501", "TID251"]
# A DomainPack may import itself. The ban above is on OTHER packages reaching into this one
# (§24.2's forbidden `core -> domains.silicon_photonics` edge); a rule that also forbade the pack's
# own internal imports would make the pack unwritable, and the obvious workaround -- relative
# imports inside the package -- would leave the real rule enforced only by a linter that had been
# taught to look away. The structural check that matters is
# `tests/unit/test_extension_boundary.py`, which parses the import graph and knows the difference
# between a package importing itself and core importing it.
"src/lab_brain/domains/silicon_photonics/**" = ["TID251"]
# The mock provider names the validity schema this domain declares, which is a provider depending
# on a DomainPack contract -- the direction §24.2 permits (`domains -> tools/simulators`, and a
# provider is bound to the domain whose schema its payloads satisfy). Core still imports neither.
"src/lab_brain/tool_providers/**" = ["TID251"]
# The mutation battery's `old=` fields are verbatim excerpts of the source lines they anchor on.
# Wrapping them with implicit concatenation would keep the line length and make the anchor
# unreadable -- and an anchor a reviewer cannot compare against the source by eye is the one
# thing this file must not have, because a mis-typed anchor reports ANCHOR NOT FOUND rather than
# a false kill only as long as someone can tell what it was meant to say.
"scripts/mutation_battery.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["lab_brain"]
strict = true
warn_unreachable = true
disallow_any_generics = true
