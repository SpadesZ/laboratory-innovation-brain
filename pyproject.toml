[project]
name = "lab-brain"
version = "0.0.1"
description = "Laboratory Innovation Brain — executable epistemic architecture (spec: SAI 3.3)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "SpadesZ", email = "rickiekuo1203@gmail.com" }]

dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
lab-brain = "lab_brain.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_brain"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# The outcome report is always written, so `check_requirement_coverage.py` can never be
# satisfied by a stale file left over from an earlier, more permissive run.
addopts = "-ra --strict-markers --strict-config --requirement-outcomes=var/requirement_outcomes.json"
markers = [
    # Requirement / Test traceability (SAI 3.3 §26). Every test that discharges a
    # normative requirement MUST carry both markers so T-SPEC-001 can verify the
    # matrix against real code rather than against prose.
    "requirement(id): Requirement ID this test discharges, e.g. ART-001",
    "spec_test(id): Test ID from the §26 traceability matrix, e.g. T-ART-001",
    # Environment gates (AGT-007: CI must pass without Postgres/licenses/network).
    "postgres: requires a live PostgreSQL instance",
    "lumerical: requires a real Lumerical license seat",
    "network: requires outbound network access",
]

[tool.ruff]
line-length = 95
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "TID"]
ignore = [
    "N818",  # exception names: spec contract names are kept verbatim
    # The spec is written in Traditional Chinese and uses fullwidth punctuation. Parsing it
    # requires those exact codepoints, and docstrings quote its section headings verbatim,
    # so "ambiguous unicode" is the intended content rather than a typo.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# §24.2 dependency rule is enforced by T-EXT-001; this is a fast local guard.
"lab_brain.domains.silicon_photonics".msg = "core/cognition MUST NOT import a DomainPack directly (§24.2)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["lab_brain"]
strict = true
warn_unreachable = true
disallow_any_generics = true
