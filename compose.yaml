# Laboratory Innovation Brain -- the research workspace as a local product.
#
#     docker compose up --build        start (then open http://127.0.0.1:8765/)
#     docker compose down              stop; every volume and all research data are kept
#     docker compose down -v           RESET: delete the database, artifacts and generated secret
#
# The development/test database is `compose.dev.yaml`; this file never uses it.
#
# WHAT RUNS
#   secrets       once: generates the two database passwords (first start) -- the migrator's into
#                 the `secrets` volume, the services' role's into `app-secrets`
#   db            PostgreSQL 17 + pgvector; on the internal network only, never published
#   init          once per start, as the migrator: every migration; the services' database roles
#                 and their privileges; then the operator's bootstrap -- the researcher, their
#                 project and membership, their LLM administration (deployment/docker/
#                 bootstrap.sh, configured by the LAB_BRAIN_* variables below)
#   web           the workspace, published on the HOST'S LOOPBACK ONLY (127.0.0.1), with accounts:
#                 each person signs in; an administrator approves registrations (see ACCOUNTS)
#   local-models  once per start: the lightweight LOCAL routes -- the host's Ollama probed through
#                 the ordinary capability tests; never a reasoning route (llm_runtime.local_setup)
#
# ACCOUNTS. The first administrator is the operator's, once, from the command line (it prints a
# one-time link to set the password; no password is typed or printed):
#     docker compose run --rm init lab-brain admin bootstrap-admin --email you@your.lab \
#         --name "Your Name" --actor act:researcher
# `--actor` binds the account to the deployment's existing researcher and their research. Others
# register at /register, confirm their address and are approved by an administrator. Account
# mail needs an SMTP server (deployment/docker/mail.env, git-ignored: LAB_BRAIN_SMTP_HOST,
# _PORT, _FROM, _USERNAME, _PASSWORD_FILE) or an outbox directory (LAB_BRAIN_MAIL_OUTBOX, read
# with `docker compose cp`); with neither, registration and password reset stay CLOSED.
#
# LEAST PRIVILEGE IN THE DATABASE. Every rule the research records keep is a trigger or a
# constraint, and a superuser or a table's owner can step past both. So only `init` connects as
# the migrator (`lab_brain`, who owns the schema); `web` and `local-models` connect as
# `lab_brain_app`, which owns nothing and holds row privileges only (`lab-brain admin db-roles`):
# no TRUNCATE, no DDL, no `session_replication_role`, the migrations ledger read-only. Neither
# service mounts the migrator's password; `lab_brain_reader` (no login) is the auditors' role.
#
# NO SECRET IS BAKED IN. The database passwords are generated at first start and live only in
# the `secrets` and `app-secrets` volumes. A model-provider API key pasted in AI model settings is kept in the
# `credentials` volume -- mounted on `web` and nowhere else, one 0600 file per key in a 0700
# directory, named by an opaque id -- and the database stores only that reference and a
# fingerprint. That is FILESYSTEM ISOLATION, NOT ENCRYPTION: whoever can read the Docker volume can
# read the keys. `docker compose down` keeps the volume; `docker compose down -v` deletes it with
# the keys in it. Keys may instead come from the optional, git-ignored file
# deployment/docker/llm-keys.env, referenced under the advanced settings as `env:NAME`.
#
# CONFIGURATION (all optional; put overrides in a git-ignored `.env` next to this file):
#   LAB_BRAIN_PORT            host loopback port of the workspace (default 8765)
#   LAB_BRAIN_ACTOR           the researcher the workspace acts as (default act:researcher)
#   LAB_BRAIN_ACTOR_NAME      their display name
#   LAB_BRAIN_PROJECT         their first project (default prj:lab), created PRIVATE: no egress
#   LAB_BRAIN_PROJECT_NAME    its name
#   LAB_BRAIN_CLEARANCE       their clearance in it (default PUBLIC,INTERNAL)
#   LAB_BRAIN_LOCALE          en or zh-TW (default en)
#   LAB_BRAIN_TZ              the time zone pages show times in (default Asia/Taipei)
#   LAB_BRAIN_OLLAMA_URL      the host's OpenAI-compatible local endpoint
#                             (default http://host.docker.internal:11434/v1; empty skips it)
#   LAB_BRAIN_INFERENCE_DEADLINE  seconds one model call may wait for its answer (default 180):
#                             ONE value for `web` (research calls, probes from the page) and
#                             `local-models` (its probes). A CPU-only local model needs more
#   LAB_BRAIN_REVIEW_AUTHORITIES_FILE  the host file pinning the review authorities whose enrolled
#                             reviewers may answer diagnostic warrant reviews (Causal Warrant Gate
#                             V1.1), mounted read-only. The default, the committed example, pins
#                             none: no answer verifies and anything needing a person waits
#   LAB_BRAIN_REVIEW_QUEUE_DECLARED_BY  the member who declares the project's review queue (its
#                             expiry is their standing decision); unset, no queue is declared

name: lab-brain-workspace

x-app: &app
  # Built once, by `web`; every other service runs the same local image and never pulls it.
  image: lab-brain-workspace:local
  pull_policy: never
  environment: &app-env
    LAB_BRAIN_DATABASE_HOST: db
    LAB_BRAIN_ACTOR: ${LAB_BRAIN_ACTOR:-act:researcher}
    LAB_BRAIN_ACTOR_NAME: ${LAB_BRAIN_ACTOR_NAME:-Local researcher}
    LAB_BRAIN_PROJECT: ${LAB_BRAIN_PROJECT:-prj:lab}
    LAB_BRAIN_PROJECT_NAME: ${LAB_BRAIN_PROJECT_NAME:-Laboratory}
    LAB_BRAIN_CLEARANCE: ${LAB_BRAIN_CLEARANCE:-PUBLIC,INTERNAL}
    LAB_BRAIN_REVIEW_AUTHORITIES: /run/lab-brain-review/authorities
    LAB_BRAIN_REVIEW_QUEUE_DECLARED_BY: ${LAB_BRAIN_REVIEW_QUEUE_DECLARED_BY:-}
  volumes:
    - ${LAB_BRAIN_REVIEW_AUTHORITIES_FILE:-./deployment/docker/review-authorities.example}:/run/lab-brain-review/authorities:ro

# Who a process is in the database. `init` alone is the migrator; the services are `lab_brain_app`.
x-migrator-db: &migrator-db
  LAB_BRAIN_DATABASE_USER: lab_brain
  LAB_BRAIN_DATABASE_PASSWORD_FILE: /run/lab-brain-secrets/db_password
x-service-db: &service-db
  LAB_BRAIN_DATABASE_USER: lab_brain_app
  LAB_BRAIN_DATABASE_PASSWORD_FILE: /run/lab-brain-app-secrets/db_password

services:
  secrets:
    <<: *app
    user: "0:0"
    entrypoint: ["python", "/app/deployment/docker/make_secret.py"]
    command:
      - /run/lab-brain-secrets/db_password
      - /run/lab-brain-app-secrets/db_password
    environment: {}
    volumes:
      - secrets:/run/lab-brain-secrets
      - app-secrets:/run/lab-brain-app-secrets
    restart: "no"

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lab_brain
      POSTGRES_DB: lab_brain
      POSTGRES_PASSWORD_FILE: /run/lab-brain-secrets/db_password
    volumes:
      - db:/var/lib/postgresql/data
      - secrets:/run/lab-brain-secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_brain -d lab_brain"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  init:
    <<: *app
    environment:
      <<: [*app-env, *migrator-db]
      # The services' role's password, which `init` sets on that role (service_roles.py).
      LAB_BRAIN_APP_PASSWORD_FILE: /run/lab-brain-app-secrets/db_password
    volumes:
      - secrets:/run/lab-brain-secrets:ro
      - app-secrets:/run/lab-brain-app-secrets:ro
      - ${LAB_BRAIN_REVIEW_AUTHORITIES_FILE:-./deployment/docker/review-authorities.example}:/run/lab-brain-review/authorities:ro
    command: ["sh", "/app/deployment/docker/bootstrap.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    build: .
    pull_policy: build
    environment:
      <<: [*app-env, *service-db]
      LAB_BRAIN_PUBLISHED_PORT: ${LAB_BRAIN_PORT:-8765}
      # The clock the pages show times in (stored times are UTC and unchanged).
      TZ: ${LAB_BRAIN_TZ:-Asia/Taipei}
      # An outbox for account mail when there is no SMTP server: a path on the outbox volume.
      LAB_BRAIN_MAIL_OUTBOX: ${LAB_BRAIN_MAIL_OUTBOX:-}
      LAB_BRAIN_OLLAMA_URL: ${LAB_BRAIN_OLLAMA_URL-http://host.docker.internal:11434/v1}
    env_file:
      - path: deployment/docker/llm-keys.env
        required: false
      # Account mail (see ACCOUNTS); absent, registration and password reset are closed.
      - path: deployment/docker/mail.env
        required: false
    command:
      - sh
      - -c
      - >-
        exec lab-brain web --accounts
        $${LAB_BRAIN_MAIL_OUTBOX:+--mail-outbox "$$LAB_BRAIN_MAIL_OUTBOX"}
        --artifact-root /var/lib/lab-brain/artifacts
        --host 0.0.0.0 --port 8765 --in-container
        --published-port "$$LAB_BRAIN_PUBLISHED_PORT"
        --host-gateway host.docker.internal
        --credential-dir /var/lib/lab-brain/credentials
        $${LAB_BRAIN_OLLAMA_URL:+--ollama-url "$$LAB_BRAIN_OLLAMA_URL"}
        --inference-deadline ${LAB_BRAIN_INFERENCE_DEADLINE:-180}
        --locale ${LAB_BRAIN_LOCALE:-en}
    ports:
      # The HOST's loopback only. Never "8765:8765", which publishes on every interface.
      - "127.0.0.1:${LAB_BRAIN_PORT:-8765}:8765"
    extra_hosts:
      # The machine this container runs on (Docker Desktop provides it; Linux needs the mapping).
      - "host.docker.internal:host-gateway"
    volumes:
      - app-secrets:/run/lab-brain-app-secrets:ro
      - ${LAB_BRAIN_REVIEW_AUTHORITIES_FILE:-./deployment/docker/review-authorities.example}:/run/lab-brain-review/authorities:ro
      - artifacts:/var/lib/lab-brain/artifacts
      # Pasted model-provider keys: this service only (see the header).
      - credentials:/var/lib/lab-brain/credentials
      - mail-outbox:/var/lib/lab-brain/outbox
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request as u;
          r = u.Request('http://127.0.0.1:8765/healthz',
          headers={'Host': 'localhost:' + os.environ['LAB_BRAIN_PUBLISHED_PORT']});
          u.build_opener(u.ProxyHandler({})).open(r, timeout=5)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  local-models:
    <<: *app
    environment:
      <<: [*app-env, *service-db]
      LAB_BRAIN_OLLAMA_URL: ${LAB_BRAIN_OLLAMA_URL-http://host.docker.internal:11434/v1}
    command:
      - sh
      - -c
      - >-
        if [ -z "$$LAB_BRAIN_OLLAMA_URL" ]; then echo "local models: not configured"; exit 0; fi;
        exec python -m lab_brain.llm_runtime.local_setup --actor "$$LAB_BRAIN_ACTOR"
        --base-url "$$LAB_BRAIN_OLLAMA_URL" --host-gateway host.docker.internal
        --inference-deadline ${LAB_BRAIN_INFERENCE_DEADLINE:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-secrets:/run/lab-brain-app-secrets:ro
      - ${LAB_BRAIN_REVIEW_AUTHORITIES_FILE:-./deployment/docker/review-authorities.example}:/run/lab-brain-review/authorities:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  db:
  artifacts:
  secrets:
  app-secrets:
  credentials:
  mail-outbox:
