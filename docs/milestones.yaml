# Milestone gate order and requirement allocation.
#
# Gate order and exit gates are transcribed from SAI 3.3 §26.1. The per-milestone
# `requirements` allocation is an implementation decision, not spec text: each
# requirement is assigned to the milestone at which its §26 pass condition can be
# fully satisfied. The union of all allocations MUST equal the 59 requirements the
# spec declares -- enforced by T-SPEC-001 against the parsed §25.3 table, so this
# number is documentation and the check does not depend on it being retyped
# correctly. It has moved with the amendments (v3.3-a1 .. a7); §0's amendment
# ledger is the record.
#
# `status` drives the CI ratchet. Once a milestone is DONE, every requirement allocated to it
# must have a traceability test that ACTUALLY EXECUTED AND PASSED -- not merely one that pytest
# would collect. Collection is not execution: @skip, @xfail(run=False), a class- or module-level
# skip, and our own backend-gate skips in tests/conftest.py are all collected while running no
# assertion. Enforced by scripts/check_requirement_coverage.py against the outcome report.
#
# `gate_profile` names the backend profiles that MUST have been enabled in the validating run.
# M0a onward declare `postgres` because schema and repository conformance is not demonstrated by
# in-memory fakes; a run that skipped every PostgreSQL test cannot sign off those gates.

schema_version: 1

milestones:
  - id: M0a
    name: Scientific Identity Foundation
    # DONE 2026-09-13 on maintainer sign-off after the §23.5 (2) coverage audit (rev 6) balanced
    # at 70 hard MUSTs over 72 classified occurrences with every delta 0. From this point the
    # executed-coverage ratchet enforces M0a on every CI run: each requirement below needs a
    # traceability test that actually executed and passed under gate_profile [postgres].
    status: DONE
    exit_gate: >-
      artifact/claim identity + bundle hash + schema/spec conformance pass;
      testable without Actor/LLM/Simulator.
    gate_profile: [postgres]
    requirements:
      # SYS-001 was allocated here in P1. That was an allocation error, corrected in P2:
      # its §26 pass condition is "rejects bypass from cognition directly to EpistemicState
      # update OR support arrays on Attestation/Hypothesis". EpistemicStateProjection and
      # Hypothesis do not exist until M0b, so only half the condition is exercisable here.
      # Under the executed-coverage gate that would mean claiming SYS-001 discharged on half a
      # test. Moved to M0b, where both halves are testable. The no-support-arrays invariant is
      # still enforced on the M0a models -- it is a schema design constraint either way.
      - ART-001
      - EVI-005
      - EVI-006
      - TST-002
      - TST-003

  - id: M0b
    name: Execution/Governance Foundation
    # IN_PROGRESS since P4 (2026-09-13). SEC-002's read gate and the R-7 split landed; the rest of
    # the milestone has not started. IN_PROGRESS rather than NOT_STARTED because work has begun --
    # the ratchet only binds at DONE, so this status is a statement to readers, and leaving it at
    # NOT_STARTED while a migration and a gate exist is simply false.
    status: IN_PROGRESS
    exit_gate: >-
      event replay + transition/authority tests + ACL/budget/trace contracts pass;
      testable without a DomainPack.
    gate_profile: [postgres]
    requirements:
      - SYS-001
      - SEC-002
      - COST-001
      - EPI-003
      - EPI-004
      - EPI-005
      - EPI-006
      - VER-006
      - OPS-002
      - OPS-003

  - id: M1
    name: Research Memory
    status: NOT_STARTED
    exit_gate: >-
      local document/run ingest; source-work dedup; delayed mock job resumes episode;
      all scientific LLM calls persist bundle+provenance; UX-001~007 tests pass.
    gate_profile: [postgres]
    requirements:
      - EVI-002
      - EVI-003
      - EVI-004
      - EVI-007
      - EVI-008
      # v3.3-a6. Admission-time obligation, so it sits with EVI-003's
      # admission gate rather than waiting for M4's root-cause vertical.
      - EVI-009
      - LLM-001
      - OPS-001
      - OPS-004
      - SEC-001
      - SEC-003
      - SEC-004
      - SRC-001
      - UX-001
      - UX-002
      - UX-003
      - UX-004
      - UX-005
      - UX-006
      - UX-007

  - id: M2
    name: Silicon Photonics Tool Layer
    status: NOT_STARTED
    exit_gate: >-
      simulated + measured fixtures use the same extractor contract;
      license/resource queue mock pass.
    gate_profile: [postgres]
    requirements:
      - SIM-001
      - SIM-002
      - SIM-003
      - EVI-001
      - DOM-SP-001
      - DOM-SP-002
      - VER-002
      - EXT-001

  - id: M3
    name: Hypothesis Brain
    status: NOT_STARTED
    exit_gate: >-
      role I/O + Position/Critique contracts pass; Critic bundle divergence measurable;
      benchmark thresholds calibrated and stored in BenchmarkPolicy before gate
      enforcement.
    gate_profile: [postgres]
    requirements:
      - EPI-001
      - LLM-002
      - SRC-002
      - SRC-003
      - VER-008

  - id: M4
    name: First Vertical (VS-SP-001)
    status: NOT_STARTED
    exit_gate: >-
      a fixed, non-cherry-picked benchmark set demonstrates root-cause correctness and
      avoids unnecessary high-cost action in predefined cases.
    gate_profile: [postgres]
    requirements:
      - VER-001
      - VER-003
      - VER-004
      - VER-005
      - VER-007
      - EPI-002
      - TST-001

  - id: M5
    name: External Evidence Expansion
    status: DEFERRED
    exit_gate: >-
      external evidence enters with source/condition/rights/provenance metadata;
      GitHub source traces to repo + resolved commit/ref; removing the GitHub provider
      does not affect core cognition.
    gate_profile: [postgres, network]
    requirements:
      - GH-001
      - GH-002
      - GH-003

  # M6-M8 are declared by §26.1. They are listed so the catalog mirrors §26.1 completely, and so a
  # spec issue can name the gate it blocks -- `check_no_open_gate_issues_for_completed_milestones`
  # rejects an issue pointing at a milestone that does not exist. M6 and M8 hold no requirements;
  # M7 gained HEU-001 under amendment v3.3-a2.
  - id: M6
    name: Multi-physics Ring
    status: DEFERRED
    exit_gate: end-to-end mechanism discrimination benchmark.
    gate_profile: [postgres]
    requirements: []

  - id: M7
    name: Operational Lab Brain
    status: DEFERRED
    exit_gate: real lab workflow pilot with low human write friction.
    gate_profile: [postgres]
    requirements:
      - HEU-001

  - id: M8
    name: Learning / Second Domain
    status: DEFERRED
    exit_gate: EXT-001 demonstrated on an adjacent domain.
    gate_profile: [postgres]
    requirements: []
