# Normative Statement Registry -- SAI 3.3 §23.6
#
# Each entry maps one hard normative statement in the specification prose to exactly
# one Requirement ID and to the Test IDs that discharge it.
#
# WHAT T-SPEC-002 CHECKS (machine-checkable, §23.5 (1)):
#   - statement keys are unique
#   - every requirement_id resolves to a requirement declared by the spec
#   - every listed test resolves to a Test ID declared by the §26 matrix
#   - an entry with no tests carries an explicit deferred_rationale + review_at
#
# WHAT IT DOES NOT CHECK (human audit gate, §23.5 (2)):
#   - that every hard MUST in the prose actually reached this file.
# That gap cannot be derived from prose by a linter. Per §23.5 a Coding Agent MUST NOT
# infer registry completeness from a passing T-SPEC-002. Completeness is asserted only
# by docs/spec_coverage_audit/<milestone>.md, signed off before each milestone exit.
#
# The first 17 entries are transcribed verbatim from the §23.6 excerpt.

