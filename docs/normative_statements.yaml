  # M0a coverage fix round 2 (2026-09-12).
  # ---------------------------------------------------------------------------

  # §9.1: "Disagreement metrics ... MUST be deterministic, versioned and defined over the
  # declared OutcomeSpace." The audit counted §9.1 as 4 hard MUSTs; it has 5.
  #
  # NOT merged into VER-004. VER-004 governs which *outcomes* count as plausible -- they must come
  # from a declared, versioned OutcomeSpace. VER-008 governs the *metric* used to rank how much
  # two predictions disagree. A planner could draw every outcome from a properly declared
  # OutcomeSpace and still rank them with an unversioned, non-deterministic distance function, and
  # T-VER-004 would pass. Ranking that cannot be reproduced makes a VerificationPlan
  # unexplainable after the fact, which is what VER-005's determinism exists to prevent one layer
  # up.
  - key: disagreement.metric.deterministic_versioned
    section: "9.1"
    level: MUST
    requirement_id: VER-008
    tests: [T-VER-008]

