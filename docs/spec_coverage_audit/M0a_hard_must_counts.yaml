# §23.5 (2) M0a hard-MUST counts, per section, with the basis for each judgement.
#
# `hard_must` is not stored as a free number. It is checked against two independent sources:
#
#   hard_must == (REGISTERED occurrences at this section in M0a_obligation_inventory.yaml)
#                + len(keyword_free)
#
# so a count cannot drift from the occurrence inventory, and the inventory cannot classify an
# occurrence REGISTERED without the count moving. `keyword_free` lists the registered MUST
# statements at this section that have NO explicit-keyword occurrence -- obligations the spec states
# declaratively (a schema rule, a table cell, 不是 / 不提供 / 都要 / 保存) which a keyword scan cannot
# see. Each needs a rationale quoting how the section states it; §10.5 is the clearest case, where
# the whole obligation rides on 不是.
#
# `basis` records how the section's total was judged, in prose, for a human reviewer. It may no
# longer discharge a section by saying an obligation is "registered elsewhere" without naming it --
# that is what the inventory's RESTATEMENT_OF(target) classification is for, and CI resolves the
# target against the registry.
#
# Recomputed by tests/spec/test_m0a_coverage_audit.py and
# tests/spec/test_m0a_obligation_inventory.py on every run.
