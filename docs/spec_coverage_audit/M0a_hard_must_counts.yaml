# Judged hard-MUST count per section for §6–§16, as required by §23.5 (2).
#
# WHY THIS FILE EXISTS
#
# Revision 2 of the M0a audit contained a row reading "§15.4: hard MUST = 2,
# registry-covered = 1, delta = 0". That is arithmetically false, and it survived review because
# the table was prose: nothing recomputed it. The numbers now live here as data, and
# tests/spec/test_m0a_coverage_audit.py recomputes every delta from this file plus
# docs/normative_statements.yaml. A row that does not balance fails CI.
#
# COMPLETENESS
#
# Every heading in §6–§16 of SAI_3.3.md must appear here, including sections whose hard-MUST count
# is 0. `test_every_spec_heading_is_audited` parses the headings out of the spec and fails if one
# is missing. Listing only the sections that happen to have registry entries would let a whole
# section of prose go unexamined -- the numbers would balance because nobody looked.
#
# THE COUNTING RULE (one formula, applied uniformly)
#
#   delta = hard_must - (registry_live_must + registry_deferred_must)
#
#   registry_live_must     entries for the section with level MUST and no deferred_rationale
#   registry_deferred_must entries with level MUST and a deferred_rationale, counted once as
#                          deferred and never also as covered
#   SHOULD entries         excluded entirely from hard-MUST coverage (§0.2 makes SHOULD normative
#                          and deviation ADR-worthy, but it is not a hard MUST)
#
# `hard_must` is a judged count, not a raw keyword-match count. Keyword scanning has two failure
# directions and both are recorded per section in `basis`:
#
#   FALSE POSITIVES  line-splitting (a rule wrapped across two lines matches twice); restatement
#                    (a table row or diagram repeating a rule owned by another section);
#                    descriptive prose (a cost characteristic such as §9.3's "不可逆", or an
#                    overview table of role I/O, which describes rather than obliges).
#   FALSE NEGATIVES  obligations phrased without a keyword. §8.2's "No LLM may directly assign a
#                    scientific transition" and §10.5's "「measurement 永遠最高」不是 core 假設"
#                    carry no MUST/不得 and were missed by the scan. Every section below was read,
#                    not only scanned.

