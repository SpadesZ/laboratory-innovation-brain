# Judged hard-MUST count per section for §6–§16, as required by §23.5 (2).
#
# WHY THIS FILE EXISTS
#
# Revision 2 of the M0a audit contained a row reading "§15.4: hard MUST = 2, registry-covered = 1,
# delta = 0". That is arithmetically false, and it survived review because the table was prose:
# nothing recomputed it. The numbers now live here as data, and
# tests/spec/test_m0a_coverage_audit.py recomputes every delta from this file plus
# docs/normative_statements.yaml. A row that does not balance fails CI.
#
# THE COUNTING RULE (one formula, applied uniformly)
#
#   delta = hard_must - (registry_live_must + registry_deferred_must)
#
#   registry_live_must     entries for the section with level MUST and no deferred_rationale
#   registry_deferred_must entries for the section with level MUST and a deferred_rationale
#                          (each counted once, as deferred -- never also as covered)
#   SHOULD entries         excluded entirely from hard-MUST coverage (§0.2 makes SHOULD
#                          normative and deviation ADR-worthy, but it is not a hard MUST)
#
# `hard_must` is a judged count, not a raw keyword-match count. The raw scan over-counts in three
# ways, each resolved by reading and recorded in `basis` below:
#   line-splitting   a rule wrapped across two lines matches twice
#   restatement      a table row repeating a rule owned by another section
#   descriptive      overview prose that describes rather than obliges
#
# Sections with hard_must: 0 are listed explicitly. Omitting them would make "every section
# reconciles" unverifiable -- a section could be silently absent rather than genuinely empty.

schema_version: 1
audit: M0a
spec_version: "3.3"
spec_amendments: [v3.3-a1, v3.3-a2, v3.3-a3]

sections:
  - section: "6.1"
    hard_must: 2
    basis: content-addressed identity; lineage separate from the content hash
  - section: "6.2"
    hard_must: 1
    basis: claim identity resolved before corroboration is counted
  - section: "6.3"
    hard_must: 2
    basis: per-field status; only EXPLICIT / VERIFIED_DERIVED carry high filtering weight
  - section: "6.4"
    hard_must: 1
    basis: an incomplete stage stays UNKNOWN and must not be model-filled
  - section: "6.5"
    hard_must: 0
    basis: table row restating GH-003, which is owned at §6.16
  - section: "6.7"
    hard_must: 0
    basis: SHOULD only (layout-aware parsing)
  - section: "6.8"
    hard_must: 1
    basis: data differing in operating conditions must not be merged directly
  - section: "6.11"
    hard_must: 1
    basis: mined output is a CandidateHeuristic awaiting human approval
  - section: "6.13"
    hard_must: 1
    basis: vector retrieval must filter by embedding model + version
  - section: "6.14"
    hard_must: 0
    basis: SHOULD only (non-intrusive ingestion)
  - section: "6.15"
    hard_must: 1
    basis: the miner draws only from approved sources and may not self-promote
  - section: "6.16"
    hard_must: 5
    basis: >-
      provider-agnostic boundary; connector errors are structured and not LLM-guessed;
      GH-001 ref-pinned fetch; GH-002 private fails closed; GH-003 no auto-promotion
  - section: "6.17"
    hard_must: 2
    basis: >-
      DEPENDENCE_UNKNOWN contributes 0 to the independent count; a basis stronger than WORK
      must escalate to human review. Three raw matches, two rules (line-splitting).
  - section: "6.18"
    hard_must: 2
    basis: belief revision is append-only; manual correction is also an event, never a row update
  - section: "6.19"
    hard_must: 1
    basis: every condition-aware record carries conditions_schema_version, validated on write
  - section: "6.20"
    hard_must: 2
    basis: >-
      dual-index migration with verified cutover; which embedding version a retrieval used must
      remain answerable
  - section: "6.21"
    hard_must: 2
    basis: >-
      retraction/erratum check status recorded even when UNKNOWN; a novelty status with no
      coverage record is unauditable. The section's third registry entry is SHOULD-level
      (the check itself) and is excluded from this count.
  - section: "7.1"
    hard_must: 0
    basis: descriptive overview table of cognitive role scope; states no obligation
  - section: "7.2"
    hard_must: 2
    basis: >-
      debate metrics recorded and round count not fixed; high-stakes Critic performs inverted
      retrieval before BELIEF_REVISION
  - section: "7.5"
    hard_must: 1
    basis: internal novelty must not be presented as global novelty
  - section: "7.6"
    hard_must: 1
    basis: every LLM scientific output carries InferenceProvenance
  - section: "8"
    hard_must: 0
    basis: the admission-gate rule is registered at §8.1, its precise location
  - section: "8.1"
    hard_must: 2
    basis: at least two competing hypotheses; admission requires the certificate fields
  - section: "8.2.1"
    hard_must: 2
    basis: >-
      transitions authorised only by versioned TransitionPolicy; required INCOMPARABLE yields
      NEED_HUMAN_REVIEW plus a ReviewItem
  - section: "9.1"
    hard_must: 4
    basis: >-
      sufficiency via side-effect-free evaluate_hypothetical; action needs predicted outcome and
      cost; no unjustified escalation; plausible outcomes come from a declared OutcomeSpace
  - section: "9.4"
    hard_must: 1
    basis: cost is a vector, never a single normalized scalar
  - section: "9.5"
    hard_must: 1
    basis: a backend with no Capability descriptor cannot be planned
  - section: "9.6"
    hard_must: 1
    basis: >-
      versioned deterministic SelectionPolicy after Pareto filtering. Two raw matches, one rule
      (line-splitting).
  - section: "10.2"
    hard_must: 2
    basis: typed tools only, no arbitrary script execution; extractors are backend-agnostic
  - section: "10.2.1"
    hard_must: 2
    basis: four verb prefixes; validate_* returns ValidationReport and never mutates raw evidence
  - section: "10.2.2"
    hard_must: 1
    basis: domain run conditions bound into the Run manifest
  - section: "10.3"
    hard_must: 1
    basis: every backend run produces a replayable manifest
  - section: "10.4"
    hard_must: 1
    basis: multi-objective trade-offs preserved; no single scalar FoM decides
  - section: "10.5"
    hard_must: 2
    basis: >-
      low-fidelity contradiction cannot REJECT; authority is a partial order and INCOMPARABLE
      is not coerced into one. Covers §10.5 and §10.5.1, registered at §10.5.
  - section: "10.6"
    hard_must: 1
    basis: sim-to-real disagreement preserved as a Conflict, never flattened
  - section: "10.7"
    hard_must: 0
    basis: the Job-ification rule is registered at §12.4, its precise location
  - section: "11"
    hard_must: 0
    basis: the core-must-not-import-domain rule is registered at §24.2
  - section: "12.3"
    hard_must: 1
    basis: cross-store writes compensated within one unit of work
  - section: "12.4"
    hard_must: 1
    basis: long-running actions are Jobs with idempotent callbacks
  - section: "12.5"
    hard_must: 1
    basis: execution trace/span contract is persisted
  - section: "13"
    hard_must: 0
    basis: SHOULD only (learning ladder)
  - section: "14.1"
    hard_must: 2
    basis: RESTRICTED_NDA forbids external egress; unclassified data defaults fail-closed
  - section: "14.3"
    hard_must: 2
    basis: >-
      external query gate -- private identifiers and exact confidential geometry must not be
      sent out; fabrication submission requires human sign-off (the latter DEFERRED)
  - section: "14.4"
    hard_must: 1
    basis: ReviewQueue carries stakes, SLA/expiry and capacity
  - section: "14.4.1"
    hard_must: 1
    basis: human review is a finite Capability whose availability comes from queue depth
  - section: "14.5"
    hard_must: 2
    basis: secret scan precedes immutable ingest; license_class gates code-generation context
  - section: "15.4"
    hard_must: 2
    basis: >-
      the groupthink-reduction claim must be falsifiable; hard gates reference a versioned
      BenchmarkPolicy with no pre-calibration thresholds. Not covered by §7.2's
      debate.metrics.recorded -- that obliges recording, this obliges refutability.
  - section: "16"
    hard_must: 0
    basis: SHOULD only (roadmap narrative)
