# §23.5 (2) M0a occurrence-level hard-obligation inventory.
#
# WHY THIS FILE EXISTS. Revision 4 of the audit counted hard obligations per section. That still
# permitted the move this file removes: a section could be written off as `hard_must: 0` with a
# prose basis saying the rule was "registered at §12.4, its precise location" -- and nothing forced
# that note to name *which* statement, nor checked that the named statement existed. §10.7 and §11
# were both closed that way.
#
# So every explicit hard-obligation keyword occurrence in §6-§16 is listed here individually and
# classified as exactly one of:
#
#   REGISTERED(target)               this occurrence is the prose home of `target`. Exactly one
#                                   occurrence per statement_key may be REGISTERED -- two sites
#                                   claiming the same key would double-count one obligation.
#   RESTATEMENT_OF(target)           this occurrence introduces no new obligation. Covers both
#                                   cross-section repetition (§10.7 restating §12.4) and the same
#                                   obligation phrased with two keywords in one sentence (§6.4's
#                                   「必須可停留」 + 「不得由模型補值」). `target` MUST resolve.
#   NON_NORMATIVE_WITH_RATIONALE     the keyword is not doing normative work: a rationale heading,
#                                   or 不可逆 used to describe a cost profile. `note` says why.
#
# WHAT MATCHES. MUST / MUST NOT / 必須 / 不得 / 不可, English case-sensitively -- a lowercase
# "must" in prose is not §0.2's keyword. 需 is NOT machine-matched: it reads as "requires" in some
# places and "needs" in others, so matching it would manufacture obligations. The 需 occurrences
# that do carry obligations are adjudicated by hand with `keyword: 需 (manual)` and are listed with
# occurrence ids of the form `<section>#M<n>`. Heading lines are skipped: a title asserting an
# obligation must state it in the body, which
# tests/spec/test_m0a_obligation_inventory.py::test_a_heading_that_asserts_an_obligation_has_one
# enforces.
#
# quote_digest is sha256(whitespace-normalized quote)[:16]. If an amendment rewords a sentence the
# digest changes and CI fails, so the classification has to be re-adjudicated rather than inherited.
# Manual occurrences carry no digest -- their quote is an extract, not a whole line.
#
# Refreshed against the document by scripts/rebuild_obligation_inventory.py. The
# classifications are human judgements and this file is their source of truth; the script
# carries them forward by occurrence_id and refuses to invent one for a new occurrence.
#
# A RESTATEMENT_OF is only correct if the target obliges the SAME thing. Amendment v3.3-a6
# corrected two that did not: §14.3's solver-budget gate pointed at a COST-001 statement that
# permanent refusal already satisfied, and its memory-admission gate pointed at an EPI-002
# statement that only binds at confirmed-root-cause time. Pointing at a resolvable key is
# necessary and not sufficient -- the target has to be able to discharge the obligation.
