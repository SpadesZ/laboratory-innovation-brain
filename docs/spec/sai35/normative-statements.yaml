normative_statements:
- requirement_id: S35-GOV-001
  key: gov.precedence
  level: MUST
  area: GOV
  section: '3.1'
  text: SAI 3.5 inherits every SAI 3.3 obligation (P1–P28, the 60 requirements and their tests, the HARD-LOCKs) and every
    SAI 3.4 obligation (ASM-001–018, G0–G9, Owner decisions D-01–D-08, security decisions A3, A9 and A12) unchanged. Until
    SAI 3.5 is activated, the inherited text wins on any conflict. No S35 statement may weaken, replace, reinterpret or reorder
    an inherited MUST, gate or Owner gate. A conflict found later is recorded as an S35 spec issue in open-spec-issues.md
    and stops the affected slice (AGT-015); it is never resolved by assuming that the newer text wins.
  acceptance_kind: deterministic
  acceptance: the candidate checker proves every SAI 3.3/3.4 file and ACTIVE_SPEC.yaml byte-identical to a38ad63 with no exception
    and rejects a one-byte mutation; compatibility.md lists every inherited obligation family with a no-weakening verdict;
    every recorded conflict has an open spec issue.
  planned_tests:
  - T-S35-GOV-001
  tests: []
  owner_component: SpecMaintenance
  phase: P35-0
  gates:
  - G-D0
  status: complete
  evidence:
  - docs/spec/sai35/check_candidate.py
  - docs/spec/sai35/compatibility.md
  - docs/spec/sai35/open-spec-issues.md
  missing: nothing for the documentation scope; the procedure is exercised only when a conflict is found
  inherited:
    sai34:
    - ASM-018
    sai33:
    - TST-002
    - TST-003
  replaces:
  - D-001
- requirement_id: S35-GOV-002
  key: gov.product_target
  level: MUST
  area: GOV
  section: '3.1'
  text: 'The product target of SiPh Lab (LIB) is an autonomous AI scientist for silicon photonics with the twelve capabilities
    CAP-01 to CAP-12 of §2, each defined operationally by the S35 requirements it lists and evidenced only by the gates it
    names. This is a target, not a description of the current system: no capability may be described as present beyond the
    evidence recorded in implementation-status.md.'
  acceptance_kind: deterministic
  acceptance: the checker finds all twelve capability rows in §2, each naming at least one registered requirement and at least
    one gate, and the registry's capability list matches; the claim audit of S35-GOV-004 finds no capability described as
    present without an evidence path.
  planned_tests:
  - T-S35-GOV-002
  tests: []
  owner_component: SpecMaintenance
  phase: P35-0
  gates:
  - G-D1
  - G-D2
  - G-D3
  - G-D4
  status: complete
  evidence:
  - docs/spec/SAI_3.5.md
  - docs/spec/sai35/check_candidate.py
  missing: 'specification scope only: no capability is demonstrated'
  inherited:
    sai34:
    - ASM-001
    - ASM-002
    sai33:
    - SYS-001
  replaces:
  - D-002
- requirement_id: S35-GOV-003
  key: gov.product_category
  level: MUST
  area: GOV
  section: '3.1'
  text: LIB is a research agent, not a literature summarizer, chatbot, simulation launcher or hypothesis-review assistant. A
    campaign is a completed experimental campaign only when the system has itself selected, registered and run at least one
    discriminating test and the campaign ends in a validated outcome state (a claim CONFIRMED through the Causal Warrant Gate,
    or a hypothesis CONTRADICTED or INCONCLUSIVE under a registered test). A campaign that ends in an explicit INSUFFICIENT_VALIDATION
    or STOPPED record, including one stopped safely before any experiment ran, is a valid operational termination but not a
    completed experimental campaign, and it is never a discovery; a scientifically accepted discovery further needs a stage-3
    claim under S35-CWG-001 and S35-CWG-002 and the conditions of §2.3. A workflow that ends at a summary, an answer, a launched
    run or a list of hypotheses for a human to review does not meet the product target.
  acceptance_kind: empirical
  acceptance: on the frozen G9 and G-D1 case sets, every campaign is classified on the three termination dimensions of lifecycle.md
    §3.1; every campaign counted as completed carries at least one registered test the system selected and ran and ends in a
    validated outcome state; a campaign stopped before any experiment is counted as a valid operational termination with experimental
    completion NOT_PERFORMED and never as completed or as a discovery; a campaign that ends with only a summary, an answer,
    a launched run or an unreviewed hypothesis list is scored as not meeting the target.
  planned_tests:
  - T-S35-GOV-003
  tests: []
  owner_component: CampaignOrchestrator
  phase: P35-4
  gates:
  - G9
  - G-D1
  status: proposed
  evidence: []
  missing: no campaign aggregate, no closed loop from selection to registered test in the product
  inherited:
    sai34:
    - ASM-001
    sai33:
    - SYS-001
    - VER-001
  replaces: []
- requirement_id: S35-GOV-004
  key: gov.claim_discipline
  level: MUST
  area: GOV
  section: '3.1'
  text: 'No document, interface, report, status file or release note may claim a capability beyond verified evidence: an evidence
    path at a named commit and, for discovery capability, the highest G-D level an independent evaluator has passed for the
    stated scope. Engineering results (tests, CI, mutation batteries, deterministic or synthetic benchmarks) are reported
    as engineering validity and never as scientific validity; success on a synthetic benchmark is never reported as validation
    of real discovery.'
  acceptance_kind: deterministic
