- requirement_id: S35-MECH-001
  key: mech.distinguishable_classes
  level: MUST
  area: MECH
  section: '3.5'
  text: 'Mechanism identity, distinguishability and diversity follow mechanism-distinguishability.md. A mechanism''s identity
    is the content hash of its canonical forward-model declaration, never its name; equal identities are aliases. For every
    pair of held hypotheses the Mechanism Explorer computes, under the experiment set E available to the campaign at its declared
    replicates and noise model, a certified interval for the worst-case joint separation over both parameter domains, and records
    one verdict against the pre-registered threshold: DISTINGUISHABLE, INDISTINGUISHABLE or UNRESOLVED. Pairwise indistinguishability
    is not an equivalence relation: no count, score, novelty decision or refutation may merge pairs transitively. Mechanism
    diversity is never a raw count of hypotheses: it is the largest number of held hypotheses that are pairwise certified DISTINGUISHABLE
    under E, reported as a lower bound with UNRESOLVED pairs treated as not distinguishable and, while any pair is UNRESOLVED,
    with an upper bound beside it. This figure is invariant under aliases, never decreases when a mechanism is added, rises
    by at most one per added mechanism and never exceeds the packing bound of the predictions'' span under E; it is not invariant
    under near-duplicates, which can raise it (counterexample S1-CE-11), so it describes the spread of the held set and is never
    by itself evidence of discovery ability or of distinct mechanism families. The verdicts are deterministic, versioned and
    recomputed whenever E, the threshold, the replicates or a parameter domain changes; every reported figure names the version
    of E and lists the aliases and UNRESOLVED pairs.'
  acceptance_kind: deterministic
  acceptance: the counterexamples S1-CE-1 to S1-CE-11 of mechanism-distinguishability.md hold, including A = 0, B = 0.75 and
    C = 1.50 at threshold 1 giving A/B and B/C INDISTINGUISHABLE, A/C DISTINGUISHABLE and diversity 2 (neither 1 nor 3), and
    {0, 0.9, 1.8, 2.7} at threshold 1 giving diversity 2 that rises to 3 when the near-duplicate 1.1 is added; adding fifty
    aliases leaves the diversity unchanged; adding one mechanism raises it by at most one; no document or report claims near-duplicate
