- requirement_id: S35-CMP-002
  key: cmp.matching
  level: MUST
  area: CMP
  section: '3.21'
  text: 'The arms are matched on model versions (identifier, digest and decoding settings); on information exposure (the same
    corpus snapshot, case material, tool descriptions and experiment catalog, no arm sees sealed truth, and prompts and tool
    outputs are logged for audit); on experimental conditions (the same cost table, simulator access, time limit, seeds per
    case and environment manifest); and on resources, by actual realized consumption, not only by caps. Every arm runs under
    the same caps. The primary analysis scores every arm at the realized-cost checkpoints of matched-budget-protocol.md §3.3,
    frozen before any arm runs and independent of outcomes: every atomic operation (model call, tool call, experiment, retry,
    repair or failure) reserves its maximum cost before it starts and may start only if that reservation fits under the cap,
    and settles its realized cost after it ends; checkpoints are evaluated retrospectively on settled costs, with every operation
    started before an answer charged in full and an unsettled operation charged its reservation; an arm''s answer at a checkpoint
    is the last answer it committed while its cumulative settled charge was within the checkpoint, so an atomic operation that
    straddles a checkpoint supplies nothing to it; and an arm''s answer depends only on its own trace, so early stopping cannot
    move the comparison point. A case whose consumption records are incomplete, unreconciled or not comparable within the frozen
    tolerance, or in which an operation started without reservation headroom or settled above its reservation, is COST_UNMATCHED;
    it stays in the denominator, scored against the arm whose records are deficient, and a comparison with more such cases than
    the frozen limit cannot support a claim that one arm is better at equal budget. Matching at the smallest final realized
    consumption among the arms, or by any rule chosen after execution, is only a labelled secondary sensitivity analysis.'
  acceptance_kind: deterministic
  acceptance: the evaluation harness refuses to score an arm whose manifest differs from another's in a matched field; realized
