- requirement_id: S35-CMP-005
  key: cmp.metrics
  level: MUST
  area: CMP
  section: '3.21'
  text: 'Five metrics are reported for every arm, each with definition, unit, n and interval: (1) true-cause discovery, reported
    as separate outcome rates at the primary checkpoint and never merged: exact identification (the true mechanism''s identity),
    experimentally indistinguishable alternative (another identity certified INDISTINGUISHABLE from it under the case''s full
    experiment set), unresolved alternative (never credited), correct abstention (no claim where no held mechanism was acceptable),
    false null, force-fit, other wrong claims, and independently validated new-mechanism discovery (a mechanism outside the
    catalog at case start that matches the truth and passed a prospectively registered test the arm did not control), while
    an exploratory proposal that was not so validated is counted only as a proposal; (2) effective mechanism diversity, the
    certified lower and upper bounds of S35-MECH-001 under the case''s experiment set, never raw hypothesis counts or transitive
    class counts; (3) discriminating-experiment efficiency, experiments and realized cost until no held mechanism certified
    distinguishable from the true one survives, censored at the budget; (4) false discoveries, the false-discovery rate at SUPPORTED
    or higher plus a weighted score in which confident wrong claims weigh more; (5) independent reproducibility, the share of
    a pre-registered subset that the evaluator reproduces in a fresh environment from the frozen manifest, where any manifest
    drift makes the re-run invalid. Exactly one primary metric is pre-registered, and no outcome category is folded into another
