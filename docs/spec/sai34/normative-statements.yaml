auditor_recommendations:
  D-01: 同意自主首次建模方向及不依賴外部 coding agent；正式啟用待規格修訂。
  D-02: 部分同意 CHARGE/PN 接面；精度、樣本數、成功率待獨立資料及用途確定後核准。
  D-03: 暫緩擴大；保留 CWG V1.1，不啟用 SP 1.1.0 或擴大 DISCRIMINATION/多原因確認。
  D-04: 同意單一合格 CHARGE worker 規劃；license、OS、HPC 額度到實驗室實查。
  D-05: 原則同意合法公開範例作開發參考；逐來源核對修改/執行/散布權，獨立測試資料不得污染。
  D-06: 有條件同意受控數值細化及核准範圍參數變更；材料模型、物理假設與越界修改另審。
  D-07: 部分保留單一 ADMIN 管理規劃；不強制所有成員核准由兩位 ADMIN，獨立科研資格與不可竄改稽核仍需驗證；A3/A9/A12 未封口，同一自然人的第二帳號不具獨立性。
  D-08: 同意按模型族/solver/有效條件分別驗收原則；license 與物理驗證未完成前維持 readiness false。
