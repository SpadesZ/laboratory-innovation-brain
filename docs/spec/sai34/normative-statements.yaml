normative_statements:
  - key: autonomy.production
    section: '1'
    level: MUST
    requirement_id: ASM-001
    tests: []
    planned_tests: [T-ASM-001]
    pass_condition: Clean deployment without external coding agents constructs unseen in-envelope models from blank workspace and completes all applicable gates with auditable human interventions.
    gates: [G1, G9]
    milestone: C34-A2
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Requires internal autonomous builder and deployment-equivalent licensed acceptance; neither exists in this delivery.
  - key: workflow.governed
    section: '1'
    level: MUST
    requirement_id: ASM-002
    tests: []
    planned_tests: [T-ASM-002]
    pass_condition: Every stage persists scoped inputs, outputs and gate decisions; restart from each boundary neither loses lineage nor bypasses cheapest sufficient verification.
    gates: [G8, G9]
    milestone: C34-A1
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Existing research workflow lacks autonomous modeling stage integration.
  - key: sources.provenance
    section: '2'
    level: MUST
    requirement_id: ASM-003
    tests: []
    planned_tests: [T-ASM-003]
    pass_condition: Missing rights, authority or project scope refuses source use; each used parameter traces to pinned content; derived example families cannot count as independent proof.
    gates: [G1, G4, G8]
    milestone: C34-A1
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Requires reference-role and parameter-level provenance plus Ansys active-content boundary.
  - key: modelspec.typed
    section: '3'
    level: MUST
    requirement_id: ASM-004
    tests: []
    planned_tests: [T-ASM-004]
    pass_condition: Missing authoritative fields, wrong units, unknown keys, nonfinite values and inconsistent model assumptions refuse construction before side effects; valid inputs round-trip units.
    gates: [G1, G3, G8]
    milestone: C34-A1
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Complete PhysicalModelSpec and CHARGE domain payload are not implemented.
  - key: construction.constrained
    section: '4'
    level: MUST
    requirement_id: ASM-005
    tests: []
    planned_tests: [T-ASM-005]
    pass_condition: Allowed typed operations construct a new project with verified vendor readback; arbitrary code, script objects, injected strings and workspace escape cause zero unauthorized side effects.
    gates: [G1, G7, G8]
    milestone: C34-A1
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Constructor, operation compiler, sandbox and vendor readback require new work; real readback also requires license.
  - key: execution.licensed
    section: '4'
    level: MUST
    requirement_id: ASM-006
    tests: []
    planned_tests: [T-ASM-006]
    pass_condition: Qualified real product records actual entitlement checkout, solver identity and outputs; unavailable license or mismatched worker blocks instead of returning a mock solver success.
    gates: [G2, G7, G8]
    milestone: C34-A2
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Licensed provider is absent; fake contract tests precede C34-A3 real execution and cannot discharge its licensed gate.
  - key: resources.recovery
    section: '4'
    level: MUST
    requirement_id: ASM-007
    tests: []
    planned_tests: [T-ASM-007]
    pass_condition: Denied budget or ACL produces no external effect; injected crash, lost lease, retry, cancellation and duplicate completion preserve one admitted result and fully reconciled attempt costs.
    gates: [G8, G9]
    milestone: C34-A1
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Existing job/resource contracts are reusable but do not qualify real worker lifecycle or vendor reconciliation.
  - key: validation.numerical
    section: '5'
    level: MUST
    requirement_id: ASM-008
    tests: []
    planned_tests: [T-ASM-008]
    pass_condition: Every declared observable passes frozen residual, conservation, mesh, domain and step refinement checks; oscillatory or nonasymptotic cases cannot pass from solver convergence alone.
    gates: [G3, G5]
    milestone: C34-A2
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Needs numerical protocol, independent validators and approved observable thresholds; physical acceptance requires licensed runs.
  - key: validation.physical
    section: '5'
    level: MUST
    requirement_id: ASM-009
    tests: []
    planned_tests: [T-ASM-009]
    pass_condition: Independent references and physical checks support only the registered validity envelope with uncertainty; trend plausibility, expert agreement or cross-solver agreement alone cannot pass G5.
    gates: [G4, G5]
    milestone: C34-A2
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Independent physical reference data, approved thresholds and licensed evaluation remain external dependencies.
  - key: benchmark.independence
    section: '5'
    level: MUST
    requirement_id: ASM-010
    tests: []
    planned_tests: [T-ASM-010]
    pass_condition: Sealed family-grouped splits are disjoint; builder cannot read expert projects, hidden truth or per-case holdout feedback; detected contamination invalidates independent acceptance.
    gates: [G4, G5, G9]
    milestone: C34-A2
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Requires isolated evaluator, family lineage, split manifest and access-control evidence.
  - key: refinement.bounded
    section: '6'
    level: MUST
    requirement_id: ASM-011
    tests: []
    planned_tests: [T-ASM-011]
    pass_condition: Only approved patch classes create immutable children; assumption, oracle or validator edits are refused or reviewed; limits stop the loop and changed models lose invalidated validation status.
    gates: [G3, G6, G8, G9]
    milestone: C34-A2
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Bounded refinement with policy-classified model patches is unimplemented.
  - key: evidence.admission
    section: '7'
    level: MUST
    requirement_id: ASM-012
    tests: []
    planned_tests: [T-ASM-012]
    pass_condition: Missing or mismatched spec, run, validity, conditions or scope prevents admission or authority upgrade; failed and unknown outputs remain traceable without becoming measured facts.
    gates: [G5, G6, G8]
    milestone: C34-A1
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Existing evidence path remains; new model and validation lineage binding still needs implementation tests.
  - key: causal.warrant
    section: '7'
    level: MUST
    requirement_id: ASM-013
    tests: []
    planned_tests: [T-ASM-013]
    pass_condition: Invalid or missing warrant, signature or rival discrimination never yields unsupported confirmation; accepted decisions rederive through existing policy and immutable events.
    gates: [G6, G8]
    milestone: C34-A2
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Existing CWG protections persist; modeling integration and expanded scientific authority await D-03.
  - key: human.intervention
    section: '8'
    level: MUST
    requirement_id: ASM-014
    tests: []
    planned_tests: [T-ASM-014]
    pass_condition: Enumerated ambiguity, missing authority, authorization and irreversible cases enter ReviewQueue; expiry or worker identity never counts as approval; resume rechecks current permissions.
    gates: [G6, G8, G9]
    milestone: C34-A0
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Owner-approved intervention envelope and new workflow integration are pending.
  - key: extension.domain_boundary
    section: '9'
    level: MUST
    requirement_id: ASM-015
    tests: []
    planned_tests: [T-ASM-015]
    pass_condition: Removing the photonics provider leaves core working; ToyDomain registers model/validator/provider contracts without core physics edits; each later solver and coupling qualifies separately.
    gates: [G1, G8, G9]
    milestone: C34-A2
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: New modeling extension is unimplemented; later solver delivery is deferred to C34-A5.
  - key: interface.bilingual
    section: '9'
    level: MUST
    requirement_id: ASM-016
    tests: []
    planned_tests: [T-ASM-016]
    pass_condition: English and Traditional Chinese render identical numeric and scientific states, costs and blockers under the same ACL; missing license and unknown validation cannot appear as success.
    gates: [G6, G8, G9]
    milestone: C34-A1
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: Existing bilingual interface needs new six-layer validation and modeling reports.
  - key: replay.reproducible
    section: '10'
    level: MUST
    requirement_id: ASM-017
    tests: []
    planned_tests: [T-ASM-017]
    pass_condition: Pinned typed inputs reproduce lowering hashes; three clean licensed runs and a second qualified worker reproduce observables within frozen tolerances and preserve complete dependency records.
    gates: [G7, G8]
    milestone: C34-A1
    status: SPECIFIED
    review_at: '2026-11-20'
    deferred_rationale: New build/dependency replay is unimplemented; real repeatability and cross-worker comparison require license.
  - key: readiness.external_gate
    section: '10'
    level: MUST
    requirement_id: ASM-018
    tests: []
    planned_tests: [T-ASM-018]
    pass_condition: Offline or mock success cannot sign licensed or physical gates; readiness remains false until every applicable gate and Owner acceptance are recorded for a qualified capability envelope.
    gates: [G1, G2, G3, G4, G5, G6, G7, G8, G9]
    milestone: C34-A0
    status: SPECIFIED
    review_at: '2026-11-20'
