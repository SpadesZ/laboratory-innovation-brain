name: CI

# TST-003 says "Spec CI MUST verify normative-statement registry coverage". A `check` target
# in the Makefile is not CI -- nothing executes it. This workflow is what turns the harness
# into an actual gate, so coverage claims stop depending on an agent reporting that it ran
# the tests locally.
#
# AGT-007: this job provisions no PostgreSQL, no Lumerical seat and no network-dependent
# service. The LAB_BRAIN_TEST_* opt-in variables stay unset, so backend tests are deselected
# rather than silently passing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-conformance:
    # Runs first and alone. A normative conflict or a traceability break BLOCKS the slice
    # (AGT-015), so there is no value in reporting lint noise from a slice that cannot ship.
    name: Spec conformance (T-SPEC-001 / T-SPEC-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Spec conformance
        run: python -m pytest tests/spec -q

      # §23.5 (2) occurrence inventory. The tests above already recompute the audit's arithmetic
      # against the inventory on disk; this proves the inventory itself is still in sync with the
      # document. An amendment that adds a hard obligation, deletes one, or rewords one fails here
      # with the occurrence ids to re-adjudicate -- rather than leaving the tests to pass against a
      # stale file that happens to still balance.
      - name: Obligation inventory is in sync with the spec (§23.5 (2))
        run: python scripts/rebuild_obligation_inventory.py --check

      # Must run AFTER pytest: it reads the outcome report that run produced. A DONE
      # milestone needs a test that actually executed and passed under its declared
      # gate_profile -- a collected-but-skipped test is not coverage.
      - name: Executed-coverage gate
        run: python scripts/check_requirement_coverage.py

      - name: IMPLEMENTATION_STATUS.md is current (AGT-003)
        run: python scripts/update_status.py --check

      - name: Environment report
        run: python scripts/verify_environment.py

  quality:
    name: Lint, types and full suite
    needs: spec-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Ruff format check
        run: python -m ruff format --check src tests scripts

      - name: mypy (strict)
        run: python -m mypy

      - name: Tests
        run: python -m pytest -q

      - name: Executed-coverage gate
        run: python scripts/check_requirement_coverage.py

  backend:
    # M0a-M4 declare `gate_profile: [postgres]`, so a run that skipped every PostgreSQL test
    # cannot sign those milestones off. Without this job the executed-coverage gate could never
    # be satisfied in CI, and the final step of the ratchet would fall back to a local run --
    # which is the agent-reports-it-passed situation the gate exists to remove.
    #
    # Separate from `quality` so the AGT-007 guarantee stays observable: `quality` proves the
    # suite is green with no backend at all, this job proves the backend-dependent half.
    name: Backend profile (postgres)
    needs: spec-conformance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lab_brain
          POSTGRES_PASSWORD: lab_brain
          POSTGRES_DB: lab_brain
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lab_brain -d lab_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LAB_BRAIN_DATABASE_URL: postgresql://lab_brain:lab_brain@localhost:5433/lab_brain
      LAB_BRAIN_TEST_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Apply migrations
        run: python scripts/migrate.py

      - name: Migrations are idempotent
        # A second run must apply nothing. If it does, the runner is not tracking applied
        # migrations and two environments will drift apart while both reporting success.
        run: python scripts/migrate.py --status

      - name: Tests (postgres profile)
        run: python -m pytest -q

      - name: Executed-coverage gate
        run: python scripts/check_requirement_coverage.py
