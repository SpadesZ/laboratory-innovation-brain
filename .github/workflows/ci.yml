name: CI

# TST-003 says "Spec CI MUST verify normative-statement registry coverage". A `check` target
# in the Makefile is not CI -- nothing executes it. This workflow is what turns the harness
# into an actual gate, so coverage claims stop depending on an agent reporting that it ran
# the tests locally.
#
# AGT-007: this job provisions no PostgreSQL, no Lumerical seat and no network-dependent
# service. The LAB_BRAIN_TEST_* opt-in variables stay unset, so backend tests are deselected
# rather than silently passing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-hygiene:
    # THE AUTHORITATIVE no-AI-attribution GATE. `.githooks/commit-msg` checks the same rule at the
    # keyboard, and a hook is advice: opt-in through core.hooksPath, skippable with --no-verify,
    # unset in a fresh clone, never run by a web-UI commit. This job is what actually holds it --
    # the same sentence 011a, 011c, 011d and 011g each had to write about SQL guards.
    #
    # A repository contribution rule, NOT a SAI Requirement. It adds no Requirement or Test ID and
    # leaves the 59 <-> 59 traceability invariant untouched, which is why it is its own job rather
    # than a step inside `spec-conformance`: that job is about normative conformance, and folding
    # repository governance into it would blur a distinction this project keeps deliberately.
    #
    # Depends on nothing and runs first. It is the cheapest check in the workflow and the one whose
    # fix is an amend rather than a code change.
    name: Commit hygiene (no AI authorship attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate walks a commit RANGE, so a default depth-1 checkout would have nothing to
          # walk. Full history is small here and makes the check independent of which event
          # triggered it -- no reliance on `github.event.before`, which is all-zeros for a new
          # branch and rewritten by a force-push.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No install step, deliberately: the checker imports only the standard library so it stays
      # runnable from a git hook on a machine where the project is not installed.
      - name: Commit messages carry no AI authorship attribution
        run: python scripts/check_commit_messages.py

  spec-conformance:
    # A normative conflict or a traceability break BLOCKS the slice (AGT-015), so there is no value
    # in reporting lint noise from a slice that cannot ship.
    name: Spec conformance (T-SPEC-001 / T-SPEC-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Spec conformance
        run: python -m pytest tests/spec -q

      # §23.5 (2) occurrence inventory. The tests above already recompute the audit's arithmetic
      # against the inventory on disk; this proves the inventory itself is still in sync with the
      # document. An amendment that adds a hard obligation, deletes one, or rewords one fails here
      # with the occurrence ids to re-adjudicate -- rather than leaving the tests to pass against a
      # stale file that happens to still balance.
      - name: Obligation inventory is in sync with the spec (§23.5 (2))
        run: python scripts/rebuild_obligation_inventory.py --check

      # This job runs only `pytest tests/spec`, so it has no whole-suite outcome report and cannot
      # derive the test inventory. `--requirements-only` says so explicitly rather than letting the
      # check generate the table from a partial report and call the file current -- which would
      # shrink every number while reporting success. The inventory half is checked in the two jobs
      # below, which do execute the whole suite.
      - name: IMPLEMENTATION_STATUS.md requirement table is current (AGT-003)
        run: python scripts/update_status.py --check --requirements-only

      - name: Environment report
        run: python scripts/verify_environment.py

  quality:
    name: Lint, types and full suite
    needs: spec-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Ruff format check
        run: python -m ruff format --check src tests scripts

      - name: mypy (strict)
        run: python -m mypy

      - name: Tests
        run: python -m pytest -q

      # AGT-003, the half the spec job cannot check. IMPLEMENTATION_STATUS.md's test inventory is
      # derived from the collection this run recorded, so it runs here, after the whole suite.
      # It previously claimed 288 tests while the suite had 307 and nothing objected.
      - name: IMPLEMENTATION_STATUS.md test inventory is current (AGT-003)
        run: python scripts/update_status.py --check

  backend:
    # M0a-M4 declare `gate_profile: [postgres]`, so a run that skipped every PostgreSQL test
    # cannot sign those milestones off. Without this job the executed-coverage gate could never
    # be satisfied in CI, and the final step of the ratchet would fall back to a local run --
    # which is the agent-reports-it-passed situation the gate exists to remove.
    #
    # Separate from `quality` so the AGT-007 guarantee stays observable: `quality` proves the
    # suite is green with no backend at all, this job proves the backend-dependent half.
    name: Backend profile (postgres)
    needs: spec-conformance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lab_brain
          POSTGRES_PASSWORD: lab_brain
          POSTGRES_DB: lab_brain
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lab_brain -d lab_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LAB_BRAIN_DATABASE_URL: postgresql://lab_brain:lab_brain@localhost:5433/lab_brain
      LAB_BRAIN_TEST_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Apply migrations
        run: python scripts/migrate.py

      - name: Migrations are idempotent
        # A second run must apply nothing. If it does, the runner is not tracking applied
        # migrations and two environments will drift apart while both reporting success.
        run: python scripts/migrate.py --status

      - name: Tests (postgres profile)
        run: python -m pytest -q

      # THE executed-coverage gate. It lives here and only here, because this is the only job
      # whose outcome report can support it: a DONE milestone needs its tests to have executed and
      # passed under the gate_profile it declares, and M0a onward declare `postgres`.
      #
      # It used to run in all three jobs. That was harmless only while no milestone was DONE --
      # the check short-circuits with "nothing to enforce" -- and broke the moment M0a became DONE:
      # the spec job runs `pytest tests/spec` (so ART-001's tests never execute) and `quality` runs
      # backend-free (so gate_profile [postgres] is not met). Both then reported M0a as unproven,
      # which was true of those runs and false of the repository.
      #
      # tests/spec/test_ci_workflow.py asserts this step exists in a job that enables every gate
      # any DONE milestone declares, so deleting it here fails CI rather than silently disarming
      # the ratchet.
      - name: Executed-coverage gate
        run: python scripts/check_requirement_coverage.py

      # The same status check as in `quality`, under the opposite profile. It must agree: the inventory
      # records *collected* counts, and collection does not depend on which backends are enabled.
      # If these two jobs ever disagree, a gate marker is changing what gets collected rather than
      # what gets skipped, and the AGT-007 guarantee is not what the table says it is.
      - name: IMPLEMENTATION_STATUS.md test inventory is current (AGT-003)
        run: python scripts/update_status.py --check
